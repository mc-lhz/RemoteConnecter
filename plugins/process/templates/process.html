<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进程管理 - RemoteConnecter</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{ url_for(pluginID ~ '_bp.static', filename='process.css') }}">
</head>
<body>
<div class="wrap">
    <header>
        <h1>进程管理</h1>
        <div class="toolbar">
            <input id="filter" type="text" placeholder="按名称或 PID 过滤" autocomplete="off" spellcheck="false">
            <label class="auto-label"><input type="checkbox" id="auto" checked> 自动刷新</label>
            <button id="refresh" class="btn" type="button">刷新</button>
            <span id="summary" class="summary"></span>
        </div>
    </header>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th class="col-pid">PID</th>
                    <th>名称</th>
                    <th class="col-num">CPU</th>
                    <th class="col-num">内存</th>
                    <th class="col-status">状态</th>
                    <th class="col-user">用户</th>
                    <th class="col-op"></th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-text" id="modal-text"></div>
        <div class="modal-actions">
            <button class="btn" id="modal-cancel" type="button">取消</button>
            <button class="btn danger" id="modal-ok" type="button">终止</button>
        </div>
    </div>
</div>

<script src="{{ url_for(pluginID ~ '_bp.static', filename='process.js') }}"></script>
</body>
</html>

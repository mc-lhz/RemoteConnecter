<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新管理</title>
    <link rel="stylesheet" href="/update/static/update.css">
</head>
<body>
    <h1>软件更新</h1>
    <div id="update-wrapper">
        <div id="remote-update-container">
            <h3>远程更新</h3>
            <input id="update-url" type="url" name="updateUrl" placeholder="https://example.com/update.exe" value="">
            <button id="remote-update-btn" type="button">开始更新</button>
            <div id="remote-update-message"></div>
        </div>
        <div id="local-update-container">
            <h3>本地更新</h3>
            <input id="update-file" type="file" name="updateFile" accept=".exe">
            <button id="local-update-btn" type="button">开始更新</button>
            <div id="local-update-message"></div>
        </div>
    </div>
    <!-- 统一重连消息框，位于更新区域下方 -->
    <div id="reconnect-message"></div>
    <script src="/shared/static/jquery.js"></script>
    <script src="/update/static/update-api.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键Viewport设置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>学校电脑管理系统 (跨设备版)</title>
    <style>
        /* ====== 基础与全局重置 ====== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: #333;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        a { text-decoration: none; }
        button { border: none; cursor: pointer; font-family: inherit; }

        /* ====== 默认布局 ====== */
        body {
                background: linear-gradient(135deg, #2196F3, #1976D2);
                overflow-y: auto;
                height: auto;
                min-height: 100vh;
            }
            .header {
                background: rgba(255, 255, 255, 0.95);
                color: #1565C0;
                padding: 25px 20px;
                text-align: center;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
                border-radius: 0 0 25px 25px;
                margin-bottom: 20px;
            }
            .logo { 
                font-size: 24px; 
                font-weight: 700; 
                color: #0D47A1; 
                margin-bottom: 10px; 
            }
            .device-tag { 
                font-size: 14px; 
                background: #4CAF50; 
                color: white;
                padding: 5px 15px; 
                border-radius: 15px; 
                display: inline-block;
            }
            .main-content {
                padding: 0 20px 100px 20px; /* 为底部导航留空间 */
                display: block;
            }
            .content-area {
                background: transparent;
                padding: 0;
            }
            .tab-content { 
                display: none; 
            }
            .tab-content.active { 
                display: block; 
                animation: fadeIn 0.5s ease;
            }
            
            /* 手机卡片样式 */
            .card {
                background: white;
                border-radius: 20px;
                padding: 25px;
                margin-bottom: 25px;
                box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
            }
            .card h2 {
                font-size: 20px;
                margin-bottom: 20px;
                color: #2196F3;
                display: flex;
                align-items: center;
                padding-bottom: 15px;
                border-bottom: 2px solid #f0f0f0;
            }
            .card h2::before {
                content: '';
                display: inline-block;
                width: 8px;
                height: 25px;
                background: #2196F3;
                border-radius: 4px;
                margin-right: 12px;
            }
            
            /* 手机内容布局 */
            .info-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
            .control-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .file-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .file-list { display: none; }
            
            .info-item, .file-item, .control-btn {
                border-radius: 15px;
                padding: 20px;
                margin-bottom: 15px;
            }
            
            /* 手机底部导航 */
            .mobile-nav-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(10px);
                display: flex;
                justify-content: space-around;
                padding: 15px 10px 25px 10px;
                box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.1);
                border-radius: 25px 25px 0 0;
                z-index: 1000;
            }
            .nav-btn {
                display: flex;
                flex-direction: column;
                align-items: center;
                color: #666;
                font-size: 12px;
                flex: 1;
                transition: all 0.3s;
                padding: 10px 5px;
                border-radius: 15px;
            }
            .nav-btn.active {
                color: #2196F3;
                background-color: rgba(33, 150, 243, 0.1);
                transform: translateY(-10px);
            }
            .nav-btn i {
                font-size: 24px;
                margin-bottom: 8px;
            }
            .nav-btn svg {
                width: 24px;
                height: 24px;
                margin-bottom: 8px;
            }
        /* ====== 通用组件样式 ====== */
        .info-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 6px solid #4CAF50;
            transition: transform 0.3s;
        }
        .info-item:hover { transform: translateY(-5px); }
        .info-label { font-size: 14px; color: #666; margin-bottom: 8px; }
        .info-value { font-size: 18px; font-weight: 600; color: #333; }
        
        .file-item {
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-radius: 10px;
            border-left: 6px solid #FF9800;
            transition: transform 0.3s;
        }
        .file-item:hover { transform: translateX(5px); }

        .file-box {
            background: linear-gradient(145deg, #e3f2fd, #bbdefb);
            border-radius: 15px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #2196F3;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .file-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.25);
            border-color: #00b4ff;
        }

        .file-name { font-size: 16px; font-weight: bold; }
        .file-size { font-size: 14px; color: #888; margin-top: 5px; }
        .file-btn {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            transition: background 0.3s;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .file-btn:hover { background: #388E3C; }
        
        .control-btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            padding: 25px 15px;
            border-radius: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .control-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(33, 150, 243, 0.3);
        }
        .control-btn i { font-size: 28px; margin-bottom: 10px; }
        
        .command-input {
            width: 100%;
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: border 0.3s;
        }
        .command-input:focus {
            outline: none;
            border-color: #2196F3;
        }
        .execute-btn {
            background: linear-gradient(135deg, #9C27B0, #7B1FA2);
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.3s;
        }
        .execute-btn:active { transform: scale(0.98); }
        
        .output {
            background: #1a1a1a;
            color: #4CAF50;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Consolas', monospace;
            font-size: 15px;
            margin-top: 20px;
            min-height: 150px;
            overflow-y: auto;
            line-height: 1.6;
        }
        
        .quote-card {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        .quote-text {
            font-size: 20px;
            font-style: italic;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .quote-author {
            font-size: 16px;
            opacity: 0.9;
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 图标字体定义 */
        .icon {
            font-family: 'Material Icons';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            -moz-osx-font-smoothing: grayscale;
        }
        #bilimusic-iframe {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 340px;
            height: 56px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            background: transparent !important;
            transition: height 0.3s ease;
            overflow: hidden;
        }
        #term-container {
            width: 100%;
            height: 550px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            background: transparent !important;
            transition: height 0.3s ease;
            overflow: hidden;
        }
    </style>
    <!-- 引入Material Icons字体 -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <!-- 顶部标题栏 -->
    <div class="header">
        <div class="logo">学校电脑管理系统</div>
    </div>
    
    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 内容区域 -->
        <div class="content-area">
            <!-- 系统信息页 -->
            <div id="system" class="tab-content active">
                <div class="card">
                    <h2>系统信息概览</h2>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">当前登录用户</div>
                            <div class="info-value">{{pcName}}\{{userName}}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">操作系统版本</div>
                            <div class="info-value">{{osVersion}}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Python版本</div>
                            <div class="info-value">{{pythonVersion}}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">软件版本</div>
                            <div class="info-value">{{softwareVersion}}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">内存使用</div>
                            <div class="info-value">{{memory}}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">网络状态</div>
                            <div class="info-value">IP: {{ip}}</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 文件下载页 -->
            <div id="files" class="tab-content">
                

                <div class="card">
                    <h2>文件下载中心</h2>
                    <button id="return-btn" class="file-btn">返回上级</button>
                    <button id="upload-btn" class="file-btn">本地上传</button>
                    <button id="remote-upload-btn" class="file-btn">远程上传</button>
                    <input type="checkbox" id="execute-checkbox" class="execute-checkbox">
                    <label for="execute-checkbox">上传并执行</label>
                    <input type="checkbox" id="tempdir-checkbox" class="tempdir-checkbox">
                    <label for="tempdir-checkbox">上传至临时目录</label>
                    <div class="file-grid">

                    </div>
                </div>
            </div>
            
            <!-- 远程控制页 -->
            <div id="remote" class="tab-content">
                <div class="card">
                    <h2>远程控制选项</h2>
                    <div class="control-grid">
                        <!-- <div class="control-btn">
                            <i class="icon">&#xe8d4;</i>
                            <span>远程桌面</span>
                        </div> -->
                        <!-- <div class="control-btn">
                            <i class="icon">&#xe323;&#xe312;</i>
                            <span>键鼠控制</span>
                        </div> -->
                        <!-- <div class="control-btn">
                            <i class="icon">&#xe333;</i>
                            <span>屏幕广播</span>
                        </div> -->
                        <!-- <div class="control-btn">
                            <i class="icon">&#xe899;</i>
                            <span>锁定电脑</span> -->
                        </div>
                        <div class="control-btn">
                            <i class="icon">&#xe5d5;</i>
                            <span>实时屏幕</span>
                        </div>
                        
                        
                    </div>
                </div>
            </div>
            
            <!-- 命令执行页 -->
            <div id="command" class="tab-content">
                <div class="card">
                    <h2>命令执行终端</h2>
                    <input type="text" class="command-input" placeholder="输入命令 (如: ipconfig, systeminfo)">
                    <button class="execute-btn">执行命令</button>
                    <div class="output">
                        
                    </div>
                </div>
            </div>
            <!-- 嵌入式终端 -->
            <div id="term" class="tab-content">
                <div class="card">
                    <h2>终端</h2>
                    <iframe id="term-container" src="/terminal" frameborder="0" allowtransparency="true"></iframe>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 手机底部导航栏 -->
    <div class="mobile-nav-bar">
        <div class="nav-btn active" data-tab="system">
            <i class="icon">&#xe1c0;</i>
            <span>系统</span>
        </div>
        <div class="nav-btn" data-tab="files">
            <i class="icon">&#xe2c6;</i>
            <span>文件</span>
        </div>
        <div class="nav-btn" data-tab="remote">
            <i class="icon">&#xe333;</i>
            <span>远程</span>
        </div>
        <div class="nav-btn" data-tab="command">
            <i class="icon">&#xe5d2;</i>
            <span>命令</span>
        </div>
        <div class="nav-btn" data-tab="term">
            <!-- <i class="icon">&#xe866;</i> -->
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                <path d="M6 9a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3A.5.5 0 0 1 6 9zM3.854 4.146a.5.5 0 1 0-.708.708L4.793 6.5 3.146 8.146a.5.5 0 1 0 .708.708l2-2a.5.5 0 0 0 0-.708l-2-2z"></path>
                <path d="M2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2H2zm12 1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h12z"></path>
            </svg>
            <span>终端</span>
        </div>
    </div>
    <iframe id="bilimusic-iframe" src="/bilimusic" scrolling="no" frameborder="0" allowtransparency="true"></iframe>
    <script src="/shared/static/jquery.js"></script>
    <script src="/main/static/index.js"></script>
    <script src="/main/static/file-manager.js"></script>
    <script>
        // 监听 bilimusic iframe 的高度变化
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'bilimusic-height') {
                var iframe = document.getElementById('bilimusic-iframe');  
                if (iframe) {
                    iframe.style.height = (e.data.collapsed ? 56 : 520) + 'px';
                }
            }
        });
    </script>
</body>
</html>

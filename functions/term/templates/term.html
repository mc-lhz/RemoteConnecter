<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>远程终端</title>
    <link rel="stylesheet" href="/term/static/xterm.min.css">
    <link rel="stylesheet" href="/shared/static/common.css">
    <link rel="stylesheet" href="/term/static/term.css">
</head>
<body>
    <div id="bar">
        <!-- 点击预设命令，通过行内onclick直接连接对应命令 -->
        <button class="preset-command" onclick="globalCmd = 'cmd.exe'; connect()">
            <img src="/term/static/images/cmd.png" alt="cmd">
            <span>cmd</span>
        </button>   
        <button class="preset-command" onclick="globalCmd = 'powershell.exe'; connect()">
            <img src="/term/static/images/powershell.png" alt="powershell">
            <span>powershell</span>
        </button>
        <input id="cmd" value="" placeholder="自定义终端程序命令 如diskpart" spellcheck="false" autocomplete="off">
        <button id="connect">连接</button>
        <span id="status">未连接</span>
        <span class="hint">任意支持终端的 exe 均可</span>
    </div>
    <div id="terminal"></div>
    <!-- 控制键区：Ctrl+C，方向键，Tab，ESC -->
    <div id="control-keys">
        <!-- Ctrl+C - 中断 -->
        <button class="preset-command" title="Ctrl+C (中断)" onclick="sendControlKey('\x03')">
            <span>Ctrl+C</span>
        </button>
        <!-- 方向键 -->
        <button class="preset-command" title="上" onclick="sendControlKey('\x1b[A')">上</button>
        <button class="preset-command" title="下" onclick="sendControlKey('\x1b[B')">下</button>
        <button class="preset-command" title="左" onclick="sendControlKey('\x1b[D')">左</button>
        <button class="preset-command" title="右" onclick="sendControlKey('\x1b[C')">右</button>
        <!-- Tab -->
        <button class="preset-command" title="Tab" onclick="sendControlKey('\t')">Tab</button>
        <!-- ESC -->
        <button class="preset-command" title="ESC" onclick="sendControlKey('\x1b')">ESC</button>
    </div>
    <script src="/term/static/xterm.min.js"></script>
    <script src="/term/static/xterm-addon-fit.min.js"></script>
    <script src="/term/static/term.js"></script>
</body>
</html>

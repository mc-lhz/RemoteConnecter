<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilimusic 播放器</title>
    <link rel="stylesheet" href="/bilimusic/static/bilimusic.css">
</head>
<body>

    <div id="bilimusic-widget" class="collapsed">
        <!-- 标题栏 -->
        <div id="widget-header">
            <span class="title">Bilimusic</span>
            <span id="toggle-icon">▼</span>
        </div>

        <!-- 内容 -->
        <div id="widget-body">
            <!-- 搜索 -->
            <div class="search-area">
                <input type="text" id="search-input" placeholder="搜索歌曲..." autocomplete="off">
                <button id="search-btn">搜索</button>
            </div>
            <!-- 搜索接口切换 -->
             <div class="search-api-switch">
                <input type="checkbox" id="use-old-api-btn">
                <label for="use-old-api-btn">使用旧版搜索接口</label>
             </div>
            <!-- 搜索结果（固定高度） -->
            <div id="result-list" class="result-list">
                <div class="empty-tip">输入关键词搜索</div>
            </div>

            <!-- 当前播放 -->
            <div class="now-playing" id="now-playing">未播放</div>

            <!-- 控制区 -->
            <div class="controls">
                <div class="progress-area">
                    <input type="range" id="progress-slider" min="0" max="0" value="0" step="0.1">
                    <span class="time-label" id="time-label">00:00 / 00:00</span>
                </div>
                <div class="button-group">
                    <button class="ctrl-btn" id="pause-btn" title="暂停/继续">⏸</button>
                    <button class="ctrl-btn stop-btn" id="stop-btn" title="停止">⏹</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/bilimusic/static/bilimusic.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>远程终端</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
        body {
            font-family: "Microsoft YaHei", -apple-system, sans-serif;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
        }
        #bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        #bar .label { font-size: 14px; color: #8b949e; }
        #cmd {
            flex: 1;
            min-width: 120px;
            max-width: 420px;
            padding: 8px 12px;
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-family: Consolas, monospace;
            font-size: 14px;
            outline: none;
        }
        #cmd:focus { border-color: #58a6ff; }
        #connect {
            padding: 8px 18px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        #connect.disconnect { background: #da3633; }
        #status { font-size: 13px; color: #8b949e; }
        #status.ok { color: #3fb950; }
        #status.err { color: #f85149; }
        #terminal {
            flex: 1;
            padding: 8px;
            min-height: 0;
        }
        .hint { font-size: 12px; color: #484f58; margin-left: auto; }
    </style>
</head>
<body>
    <div id="bar">
        <span class="label">启动程序</span>
        <input id="cmd" value="cmd.exe" spellcheck="false" autocomplete="off" placeholder="cmd / powershell / python ...">
        <button id="connect">连接</button>
        <span id="status">未连接</span>
        <span class="hint">任意支持终端的 exe 均可</span>
    </div>
    <div id="terminal"></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script>
        (function () {
            var term = new Terminal({
                cursorBlink: true,
                fontFamily: 'Consolas, "Courier New", monospace',
                fontSize: 14,
                theme: {
                    background: '#0d1117',
                    foreground: '#c9d1d9',
                    cursor: '#58a6ff',
                    selectionBackground: '#264f78'
                }
            });
            var fit = new FitAddon.FitAddon();
            term.loadAddon(fit);
            term.open(document.getElementById('terminal'));
            fit.fit();

            var ws = null;
            var statusEl = document.getElementById('status');
            var btn = document.getElementById('connect');

            function setStatus(text, cls) {
                statusEl.textContent = text;
                statusEl.className = cls || '';
            }

            function connect() {
                var cmd = document.getElementById('cmd').value.trim() || 'cmd.exe';
                var proto = location.protocol === 'https:' ? 'wss' : 'ws';
                var url = proto + '://' + location.host + '/terminal/api/ws?cmd=' + encodeURIComponent(cmd);
                setStatus('连接中...');
                ws = new WebSocket(url);

                ws.onopen = function () {
                    setStatus('已连接: ' + cmd, 'ok');
                    btn.textContent = '断开';
                    btn.classList.add('disconnect');
                    term.reset();
                };
                ws.onmessage = function (e) {
                    try {
                        var obj = JSON.parse(e.data);
                        if (obj.type === 'exit') {
                            term.write('\r\n\x1b[90m[进程已退出 code=' + (obj.code === null ? '?' : obj.code) + ']\x1b[0m\r\n');
                            disconnect();
                        } else if (obj.type === 'error') {
                            term.write('\r\n\x1b[31m[错误] ' + obj.msg + '\x1b[0m\r\n');
                            disconnect();
                        }
                    } catch (err) {
                        term.write(e.data);
                    }
                };
                ws.onclose = function (e) {
                    if (ws) { ws = null; }
                    btn.textContent = '连接';
                    btn.classList.remove('disconnect');
                    if (e.reason) {
                        setStatus('已断开: ' + e.reason + ' (code ' + e.code + ')', 'err');
                    } else if (e.code === 1000) {
                        setStatus('已断开', '');
                    } else {
                        setStatus('连接断开 (code ' + e.code + ')', 'err');
                    }
                };
                ws.onerror = function () {
                    setStatus('连接出错', 'err');
                };
            }

            function disconnect() {
                if (ws) {
                    try { ws.close(); } catch (e) { /* ignore */ }
                    ws = null;
                }
                btn.textContent = '连接';
                btn.classList.remove('disconnect');
                setStatus('已断开');
            }

            btn.addEventListener('click', function () {
                if (ws && ws.readyState <= 1) { disconnect(); }
                else { connect(); }
            });

            term.onData(function (d) {
                if (ws && ws.readyState === 1) { ws.send(d); }
            });

            term.onResize(function (dim) {
                if (ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'resize', cols: dim.cols, rows: dim.rows }));
                }
            });

            window.addEventListener('resize', function () {
                try { fit.fit(); } catch (e) { /* ignore */ }
            });

            // 回车直接连接
            document.getElementById('cmd').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { connect(); }
            });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新管理</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #fff;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 24px;
        }
        #update-container {
            max-width: 400px;
            margin: 0 auto;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        button {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #333;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
        }
        button:hover {
            background: #555;
        }
        #update-message {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #333;
        }
        #reconnect-message {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>软件更新</h1>
    <div id="update-container">
        <input id="update-url" type="url" name="updateUrl" placeholder="https://example.com/update.exe" value="">
        <button id="update-btn" type="button">开始更新</button>
        <div id="update-message"></div>
        <div id="reconnect-message"></div>
    </div>
    <script src="/static/jquery.js"></script>
    <script src="/static/update-api.js"></script>
</body>
</html>

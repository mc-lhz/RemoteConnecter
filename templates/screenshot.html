<!DOCTYPE html>
<html>
<head>
    <title>实时屏幕</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #ffffff;
        }
        #video-container {
            position: relative;
            display: inline-block;
        }
        #mjpeg-stream {
            max-width: 100%;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border: 2px solid #333;
            border-radius: 4px;
        }
        #fps-display {
            margin-top: 10px;
            color: #aaa;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <img id="mjpeg-stream" src="" alt="实时屏幕流">
    </div>
    <div id="fps-display">FPS: 0</div>

    <script src="static/jquery.js"></script>
    <script src="static/jquery-ui.min.js"></script>
    <script src="/static/mjpeg-stream.js"></script>
    <script src="/static/screen-control.js"></script>

    
</body>
</html>
